#### Simulation parameters for Wafer-to-Wafer (W2W) hybrid bonding simulation.
w2w_simulation:
  # === General Settings ===
  MODE: "W2W_Hybrid_Bonding_Simulation"  # Name of the simulation
  DEBUG: false                                      # Enable debug mode
  # === Wafer and Die Settings ===
  NUM_WAFERS: 1                        # Number of wafers used in simulation
  PITCH_r_um: 115                            # Row pad pitch (µm)
  PITCH_c_um: 115                            # Column pad pitch (µm)
  DIE_W_um: 1400                          # Die width (µm)
  DIE_L_um: 1630                          # Die length (µm)
  WAF_R_um: 15000                         # Wafer radius (µm)
  PAD_ARR_ROW: 14
  PAD_ARR_COL: 12
  PAD_BOT_R_um: 50                      # Bottom Cu pad radius (um)
  PAD_TOP_R_um: 50                      # Top Cu pad radius (um)
  PAD_BOT_R_um_ratio: 0.5                  # Ratio of bottom pad dimension to the PITCH_um
  PAD_TOP_R_um_ratio: 0.667                # Ratio of top pad radius to bottom pad radius
  VOID_SHAPE: "circle"                  # Void shape: "circle" or "square"
  dice_width: 100                      # Width of one die (µm)
  pad_yield_flag: True
  pad_yield_map_sub_factor: 10          # Subsampling factor for pad yield map (1: no subsampling, 10: rows/10 and cols/10)
                                        # The pad yield map will be of size (ceil(PAD_ARR_ROW/sub_factor), ceil(PAD_ARR_COL/sub_factor))

  # === Fault-Tolerance Parameters ===
  redundant_flag: True                  # Enable redundant pads
  critical_pad_ratio: 0.998               # Critical pad ratio per die
  redundant_pad_ratio: 0.002              # Redundant pad ratio per die
  redundant_block_interval: 2           # Interval between redundant pad blocks
  pad_block_dim_x: 115                  # Pad block width dimension (µm)
  pad_block_dim_y: 115                  # Pad block height dimension (µm)
  redundant_logical_pad_ratio: 0.3      # Ratio of redundant logical pads
  redundant_logical_pad_copy: 2         # Number of copies for each redundant logical pad
  redundant_logical_pad_dist: 2.0      # Distance between redundant logical pads (PITCH_um)
  multi2one_flag: false                 # Enable multi-to-one mapping
  multi2one_ratio: 80                   # Ratio for multi-to-one mapping (e.g., 80:1 replicas)

  CONTACT_AREA_CONSTRAINT: 0.5         # Minimum allowed contact area ratio
  CRITICAL_DIST_CONSTRAINT: 0.5        # Minimum distance constraint for critical pads

  # === Misalignment Parameters ===
  RANDOM_MISALIGNMENT_MEAN_um: 0        # Mean of random overlay error (µm)
  RANDOM_MISALIGNMENT_STD_um: 2e-2         # Std of random overlay error (µm)
  SYSTEM_TRANSLATION_X_MEAN_um: 0       # Mean of systematic X translation (µm)
  SYSTEM_TRANSLATION_X_STD_um: 2e-2        # Std of systematic X translation (µm)
  SYSTEM_TRANSLATION_Y_MEAN_um: 0       # Mean of systematic Y translation (µm)
  SYSTEM_TRANSLATION_Y_STD_um: 2e-2        # Std of systematic Y translation (µm)
  SYSTEM_ROTATION_MEAN_rad: 5e-8            # Mean of systematic rotation (rad)
  SYSTEM_ROTATION_STD_rad: 1e-8             # Std of systematic rotation (rad)

  # === Bowing and Magnification ===
  BOW_DIFFERENCE_MEAN_um: 0.5               # Wafer bowing difference mean (µm)
  BOW_DIFFERENCE_STD_um: 0.1                 # Wafer bowing difference std (µm)
  k_mag: 0.1                           # Magnification coefficient
  M_0: 0                                # Magnification offset (ppm)

  # === Defect Parameters ===
  D0: 1e-9                              # Particle density (1/µm²)
  z: 3                                  # Particle thickness distribution exponent
  t_0: 1                                # Minimum particle thickness (µm)
  k_r: 1.8e-4
  k_r0: 230
  k_L: 6.2e-2
  k_n: 9e-5
  k_S: 2.7

  # === Cu Dishing Parameters ===
  TOP_DISH_MEAN_nm: -10.0                  # Top pad dish mean (nm)
  TOP_DISH_STD_nm: 1.0                     # Top pad dish std (nm)
  BOT_DISH_MEAN_nm: -10.0                  # Bottom pad dish mean (nm)
  BOT_DISH_STD_nm: 1.0                     # Bottom pad dish std (nm)
  k_et: 0.053                           # Top Cu expansion coefficient (nm/K)
  k_eb: 0.053                           # Bottom Cu expansion coefficient (nm/K)
  T_R: 25                               # Room temperature (°C)
  T_anl: 300                            # Annealing temperature (°C)

  # === Roughness Parameters ===
  Asperity_R_m: 2e-6                      # Asperity curvature radius (m)
  Roughness_sigma_m: 1e-9                 # Surface roughness std (m)
  eta_s: 40e12                          # Asperity density (1/m²)
  Roughness_constant: 0.07
  Adhesion_energy: 1.2                  # Adhesion energy (J/m²)
  Young_modulus_Pa: 7.3e10                 # Young's modulus (Pa)
  Dielectric_thickness: 1.5e-6          # Dielectric thickness (m)
  DISH_0_m: 75e-9                         # Reference dish depth (m)
  k_peel: 6.66e12                       # Peel force constant (N/m⁴/K)

  # === Simulation Control ===
  simulation_times: 1                  # Number of simulation iterations
  approximate_set: 1                 # 1: disable overlay simulation approximation, 100: enable


#### Modeling parameters for Wafer-to-Wafer (W2W) hybrid bonding simulation.
w2w_modeling:
  # === General Settings ===
  MODE: "W2W_Hybrid_Bonding_Modeling"   # Name of the modeling
  DEBUG: false                          # Enable debug mode
  # === Per Wafer Parameters ===
  PITCH_r_um: 10                              # Row pad PITCH_um (µm)
  PITCH_c_um: 10                              # Column pad PITCH_um (µm)
  DIE_W_um: 10000                          # Die width (µm)
  DIE_L_um: 10000                          # Die length (µm)
  WAF_R_um: 150000                         # Wafer radius (µm)
  PAD_BOT_R_um_ratio: 0.5                  # Ratio of bottom pad dimension to the PITCH_um
  PAD_TOP_R_um_ratio: 0.667                # Ratio of top pad radius to bottom pad radius
  VOID_SHAPE: "circle"                  # Shape of void: "circle" or "square"
  dice_width: 1000                      # Dice width to separate dies (µm)
  pad_yield_flag: True
  pad_yield_map_sub_factor: 50          # Subsampling factor for pad yield map (1: no subsampling, 10: rows/10 and cols/10)

  # === Fault Tolerance Parameters ===
  redundant_flag: True                  # Enable redundant pads
  critical_pad_ratio: 0.9               # Critical pad ratio per die
  redundant_pad_ratio: 0.1              # Redundant pad ratio per die
  redundant_block_interval: 2           # Interval between redundant pad blocks
  pad_block_dim_x: 400                  # Pad block width dimension (µm)
  pad_block_dim_y: 400                  # Pad block height dimension (µm)
  redundant_logical_pad_ratio: 0.3      # Ratio of redundant logical pads
  redundant_logical_pad_copy: 2         # Number of copies for each redundant logical pad
  redundant_logical_pad_dist: 40.0      # Distance between redundant logical pads (PITCH_um)
  multi2one_flag: False                 # Enable multi-to-one mapping
  multi2one_ratio: 20                   # Ratio for multi-to-one mapping (e.g., 80:1 replicas)

  CONTACT_AREA_CONSTRAINT: 0.5         # Minimum allowed contact area ratio
  CRITICAL_DIST_CONSTRAINT: 0.5        # Minimum distance constraint for critical pads

  # === Overlay Parameters ===
  num_samples: 10000                    # Number of samples for misalignment input parameters
  RANDOM_MISALIGNMENT_MEAN_um: 0        # Mean of random overlay error (µm)
  RANDOM_MISALIGNMENT_STD_um: 2e-2         # Std of random overlay error (µm)
  SYSTEM_TRANSLATION_X_MEAN_um: 0       # Mean of systematic X translation (µm)
  SYSTEM_TRANSLATION_X_STD_um: 2e-2        # Std of systematic X translation (µm)
  SYSTEM_TRANSLATION_Y_MEAN_um: 0       # Mean of systematic Y translation (µm)
  SYSTEM_TRANSLATION_Y_STD_um: 2e-2        # Std of systematic Y translation (µm)
  SYSTEM_ROTATION_MEAN_rad: 5e-8            # Mean of systematic rotation (rad)
  SYSTEM_ROTATION_STD_rad: 1e-8             # Std of systematic rotation (rad)
  BOW_DIFFERENCE_MEAN_um: 0.5               # Bow difference mean (µm)
  BOW_DIFFERENCE_STD_um: 0.1                 # Bow difference std (µm)
  k_mag: 0.1                           # Magnification slope coefficient
  M_0: 0                                # Magnification offset

  # === Defect Parameters ===
  D0: 1e-9                              # Particle density (1/µm²)
  z: 3                                  # Thickness distribution exponent factor
  t_0: 0.1                              # Minimum particle thickness (µm)
  k_r: 1.8e-4
  k_r0: 230
  k_L: 6.2e-2
  k_n: 9e-5
  k_S: 2.7

  # === Cu Expansion / Dishing Parameters ===
  TOP_DISH_MEAN_nm: -10                  # Top pad dish mean (nm)
  TOP_DISH_STD_nm: 1.0                     # Top pad dish std (nm)
  BOT_DISH_MEAN_nm: -10                  # Bottom pad dish mean (nm)
  BOT_DISH_STD_nm: 1.0                     # Bottom pad dish std (nm)
  k_et: 0.053                           # Top Cu expansion coef (nm/K)
  k_eb: 0.053                           # Bottom Cu expansion coef (nm/K)
  T_R: 25                               # Room temperature (°C)
  T_anl: 300                            # Annealing temperature (°C)

  # === Roughness Parameters ===
  Asperity_R_m: 2e-6                      # Asperity curvature radius (m)
  Roughness_sigma_m: 1.0e-9               # Roughness standard deviation (m)
  eta_s: 40e12                          # Asperity density (1/m²)
  Roughness_constant: 0.07
  Adhesion_energy: 1.3                  # Adhesion energy (J/m²)
  Young_modulus_Pa: 73e9                   # Dielectric Young's modulus (Pa)
  Dielectric_thickness: 1.5e-6          # Dielectric layer thickness (m)
  DISH_0_m: 75e-9                         # Reference dish height (m)
  k_peel: 6.66e15                       # Peel force coefficient (N/m⁴/K)




